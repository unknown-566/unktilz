<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>unktilz</title>
    <meta name="description" content="Minecraft utilities, dev tools, file converters and everyday helpers, in one place." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // The theme before anything draws, so the page doesn't flash dark first (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('unktilz-theme');
        if (['dark', 'light', 'midnight', 'terminal', 'paper', 'purple', 'polar', 'contrast'].indexOf(t) < 0) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
